<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<link rel="icon" type="image/jpeg" href="icon.JPG">
<link rel="apple-touch-icon" href="icon.JPG">
<meta name="theme-color" content="#071b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>جلسة التركيز</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#061311;
--bg2:#0b211e;
--panel:rgba(255,255,255,.055);
--panel2:rgba(255,255,255,.09);
--border:rgba(255,255,255,.1);
--text:#f4fffc;
--muted:#91aaa5;
--green:#10b981;
--green2:#2dd4bf;
--danger:#ef4444;
}
body{
min-height:100vh;
font-family:Arial,"Tahoma",sans-serif;
background:
radial-gradient(circle at 20% 15%,rgba(16,185,129,.14),transparent 30%),
radial-gradient(circle at 80% 85%,rgba(45,212,191,.1),transparent 30%),
linear-gradient(145deg,var(--bg),var(--bg2));
color:var(--text);
overflow-x:hidden;
}
button,input{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{
position:fixed;right:0;top:0;width:260px;height:100vh;
padding:25px 18px;background:rgba(5,18,16,.9);
backdrop-filter:blur(25px);
border-left:1px solid var(--border);z-index:20
}
.logo{
display:flex;align-items:center;gap:12px;padding:4px 7px 30px
}
.logo-img{
width:46px;height:46px;border-radius:14px;overflow:hidden
}
.logo-img img{width:100%;height:100%;object-fit:cover}
.logo h2{font-size:18px}
.logo p{font-size:11px;color:var(--muted);margin-top:4px}
.nav{display:grid;gap:7px}
.nav button{
border:0;background:transparent;color:var(--muted);
padding:14px;border-radius:14px;text-align:right;
transition:.2s
}
.nav button:hover,.nav button.active{
background:var(--panel2);color:var(--text)
}
.nav button.active{box-shadow:inset -3px 0 var(--green)}
.main{
width:calc(100% - 260px);margin-right:260px;
min-height:100vh;padding:35px
}
.top{
max-width:1100px;margin:auto;
display:flex;justify-content:space-between;align-items:center;
margin-bottom:30px
}
.menu{
display:none;width:45px;height:45px;border-radius:13px;
border:1px solid var(--border);background:var(--panel);color:var(--text)
}
.hero{
max-width:1100px;margin:auto;
padding:42px;border:1px solid var(--border);
border-radius:30px;
background:linear-gradient(135deg,rgba(16,185,129,.14),rgba(45,212,191,.035)),var(--panel);
box-shadow:0 25px 70px rgba(0,0,0,.3)
}
.hero h1{font-size:clamp(30px,5vw,52px);margin-bottom:12px}
.hero p{color:var(--muted);line-height:1.9;max-width:650px}
.dashboard{
max-width:1100px;margin:25px auto 0;
display:grid;grid-template-columns:1.35fr .65fr;gap:20px
}
.timer-card,.side-card{
border:1px solid var(--border);
background:var(--panel);
border-radius:25px;padding:28px
}
.timer-card{text-align:center}
.timer-label{color:var(--muted);font-size:14px;margin-bottom:12px}
.timer{
font-size:clamp(65px,12vw,120px);
font-weight:800;
letter-spacing:3px;
font-variant-numeric:tabular-nums;
direction:ltr;
text-shadow:0 0 35px rgba(45,212,191,.15)
}
.progress{
height:7px;border-radius:20px;background:rgba(255,255,255,.07);
overflow:hidden;margin:22px 0
}
.progress span{
display:block;height:100%;width:100%;
background:linear-gradient(90deg,var(--green),var(--green2));
border-radius:20px;transition:width .4s linear
}
.controls{
display:flex;justify-content:center;gap:10px;flex-wrap:wrap
}
.btn{
border:1px solid var(--border);
background:var(--panel2);color:var(--text);
padding:12px 20px;border-radius:13px
}
.btn.primary{
border:0;background:linear-gradient(135deg,var(--green),var(--green2));
color:#03231c;font-weight:800
}
.btn.danger{color:#fecaca}
.side-card h3{margin-bottom:20px}
.stat{
display:flex;justify-content:space-between;
padding:15px 0;border-bottom:1px solid var(--border)
}
.stat:last-child{border-bottom:0}
.stat span:first-child{color:var(--muted)}
.task{
max-width:1100px;margin:20px auto 0;
display:flex;gap:10px
}
.task input{
flex:1;height:52px;border:1px solid var(--border);
border-radius:14px;background:var(--panel);
color:var(--text);padding:0 16px;outline:none
}
.task input:focus{border-color:rgba(45,212,191,.55)}
.focus-list{
max-width:1100px;margin:18px auto;
display:grid;gap:10px
}
.focus-item{
display:flex;align-items:center;gap:12px;
padding:16px;border:1px solid var(--border);
background:var(--panel);border-radius:15px
}
.check{
width:24px;height:24px;border-radius:8px;
border:1px solid var(--border);
background:transparent;color:white
}
.focus-item.done .task-text{
text-decoration:line-through;color:var(--muted)
}
.delete{
margin-right:auto;border:0;background:transparent;
color:var(--muted);font-size:20px
}
.settings{
max-width:1100px;margin:25px auto;
display:grid;grid-template-columns:repeat(3,1fr);gap:15px
}
.setting{
padding:20px;border:1px solid var(--border);
background:var(--panel);border-radius:20px
}
.setting h4{margin-bottom:12px}
.setting select{
width:100%;height:45px;border:1px solid var(--border);
background:#102622;color:var(--text);
border-radius:11px;padding:0 10px
}
.empty{text-align:center;color:var(--muted);padding:30px}
.toast{
position:fixed;left:20px;bottom:20px;
padding:13px 18px;background:#102622;
border:1px solid var(--border);border-radius:13px;
transform:translateY(100px);opacity:0;transition:.3s;z-index:100
}
.toast.show{transform:translateY(0);opacity:1}

@media(max-width:850px){
.sidebar{transform:translateX(100%);transition:.3s}
.sidebar.open{transform:translateX(0)}
.main{width:100%;margin-right:0;padding:20px}
.menu{display:block}
.dashboard{grid-template-columns:1fr}
.settings{grid-template-columns:1fr}
.hero{padding:28px}
}
@media(max-width:560px){
.timer-card,.side-card{padding:22px}
.task{flex-direction:column}
.task .btn{width:100%}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">
<div class="logo">
<div class="logo-img">
<img src="icon.JPG" alt="جلسة التركيز">
</div>
<div>
<h2>جلسة التركيز</h2>
<p>أنجز بلا تشتيت</p>
</div>
</div>

<nav class="nav">
<button class="active" data-section="focus">◉ جلسة التركيز</button>
<button data-section="tasks">✓ المهام</button>
<button data-section="stats">▣ الإحصائيات</button>
</nav>
</aside>

<main class="main">

<div class="top">
<button class="menu" id="menu">☰</button>
<div></div>
</div>

<section class="hero">
<h1>ركّز على ما يهم.</h1>
<p>
جلسة عمل هادئة تساعدك على الدخول في حالة تركيز عميق،
تقليل التشتت، وإنهاء مهامك خطوة بخطوة.
</p>
</section>

<section class="dashboard">

<div class="timer-card">
<div class="timer-label" id="modeLabel">جلسة تركيز</div>
<div class="timer" id="timer">25:00</div>

<div class="progress">
<span id="progress"></span>
</div>

<div class="controls">
<button class="btn primary" id="start">ابدأ</button>
<button class="btn" id="pause">إيقاف مؤقت</button>
<button class="btn danger" id="reset">إعادة</button>
</div>
</div>

<div class="side-card">
<h3>إحصائياتك</h3>

<div class="stat">
<span>جلسات اليوم</span>
<strong id="sessions">0</strong>
</div>

<div class="stat">
<span>الدقائق المركزة</span>
<strong id="minutes">0</strong>
</div>

<div class="stat">
<span>المهام المكتملة</span>
<strong id="completed">0</strong>
</div>
</div>

</section>

<section class="task">
<input id="taskInput" placeholder="ما المهمة التي ستعمل عليها الآن؟">
<button class="btn primary" id="addTask">إضافة مهمة</button>
</section>

<section class="focus-list" id="focusList"></section>

<section class="settings">

<div class="setting">
<h4>مدة التركيز</h4>
<select id="focusDuration">
<option value="15">15 دقيقة</option>
<option value="25" selected>25 دقيقة</option>
<option value="45">45 دقيقة</option>
<option value="60">60 دقيقة</option>
</select>
</div>

<div class="setting">
<h4>مدة الاستراحة</h4>
<select id="breakDuration">
<option value="5" selected>5 دقائق</option>
<option value="10">10 دقائق</option>
<option value="15">15 دقيقة</option>
</select>
</div>

<div class="setting">
<h4>الوضع</h4>
<select id="soundMode">
<option value="silent">صامت</option>
<option value="bell">تنبيه عند الانتهاء</option>
</select>
</div>

</section>

</main>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const KEY="focus_session_v1";

const defaultState={
focusDuration:25,
breakDuration:5,
soundMode:"silent",
sessions:0,
minutes:0,
tasks:[
{id:1,text:"ابدأ أول جلسة تركيز",done:false}
]
};

let state=JSON.parse(localStorage.getItem(KEY))||defaultState;
let mode="focus";
let remaining=state.focusDuration*60;
let total=remaining;
let running=false;
let interval=null;

const timer=document.getElementById("timer");
const progress=document.getElementById("progress");
const modeLabel=document.getElementById("modeLabel");
const sessions=document.getElementById("sessions");
const minutes=document.getElementById("minutes");
const completed=document.getElementById("completed");
const focusList=document.getElementById("focusList");
const toast=document.getElementById("toast");

function save(){
localStorage.setItem(KEY,JSON.stringify(state));
}

function showToast(text){
toast.textContent=text;
toast.classList.add("show");
clearTimeout(showToast.timer);
showToast.timer=setTimeout(()=>toast.classList.remove("show"),2200);
}

function formatTime(seconds){
const m=Math.floor(seconds/60).toString().padStart(2,"0");
const s=(seconds%60).toString().padStart(2,"0");
return `${m}:${s}`;
}

function updateTimer(){
timer.textContent=formatTime(remaining);
const percent=Math.max(0,(remaining/total)*100);
progress.style.width=percent+"%";
modeLabel.textContent=mode==="focus"?"جلسة تركيز":"استراحة";
}

function resetTimer(){
clearInterval(interval);
interval=null;
running=false;
remaining=(mode==="focus"?state.focusDuration:state.breakDuration)*60;
total=remaining;
updateTimer();
}

function switchMode(){
mode=mode==="focus"?"break":"focus";
remaining=(mode==="focus"?state.focusDuration:state.breakDuration)*60;
total=remaining;
updateTimer();
}

function finishSession(){

clearInterval(interval);
interval=null;
running=false;

if(mode==="focus"){
state.sessions++;
state.minutes+=state.focusDuration;
save();
renderStats();
showToast("انتهت جلسة التركيز");
}else{
showToast("انتهت الاستراحة");
}

if(state.soundMode==="bell"){
try{
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const osc=ctx.createOscillator();
const gain=ctx.createGain();
osc.frequency.value=700;
gain.gain.value=.12;
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
setTimeout(()=>osc.stop(),350);
}catch(e){}
}

switchMode();
}

function startTimer(){

if(running)return;

running=true;

interval=setInterval(()=>{
remaining--;

if(remaining<=0){
finishSession();
return;
}

updateTimer();

},1000);
}

function pauseTimer(){
clearInterval(interval);
interval=null;
running=false;
}

document.getElementById("start").addEventListener("click",startTimer);
document.getElementById("pause").addEventListener("click",pauseTimer);

document.getElementById("reset").addEventListener("click",()=>{
resetTimer();
showToast("تمت إعادة الجلسة");
});

document.getElementById("focusDuration").value=state.focusDuration;
document.getElementById("breakDuration").value=state.breakDuration;
document.getElementById("soundMode").value=state.soundMode;

document.getElementById("focusDuration").addEventListener("change",e=>{
state.focusDuration=Number(e.target.value);
if(mode==="focus")resetTimer();
save();
});

document.getElementById("breakDuration").addEventListener("change",e=>{
state.breakDuration=Number(e.target.value);
if(mode==="break")resetTimer();
save();
});

document.getElementById("soundMode").addEventListener("change",e=>{
state.soundMode=e.target.value;
save();
});

function renderStats(){
sessions.textContent=state.sessions;
minutes.textContent=state.minutes;
completed.textContent=state.tasks.filter(x=>x.done).length;
}

function renderTasks(){

focusList.innerHTML="";

if(!state.tasks.length){
focusList.innerHTML='<div class="empty">لا توجد مهام بعد.</div>';
return;
}

state.tasks.forEach(task=>{

const item=document.createElement("div");
item.className="focus-item"+(task.done?" done":"");

item.innerHTML=`
<button class="check" data-action="toggle" data-id="${task.id}">
${task.done?"✓":""}
</button>
<span class="task-text">${escapeHTML(task.text)}</span>
<button class="delete" data-action="delete" data-id="${task.id}">×</button>
`;

focusList.appendChild(item);

});
}

function escapeHTML(text){
return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

document.getElementById("addTask").addEventListener("click",addTask);

document.getElementById("taskInput").addEventListener("keydown",e=>{
if(e.key==="Enter")addTask();
});

function addTask(){

const input=document.getElementById("taskInput");
const text=input.value.trim();

if(!text){
showToast("اكتب المهمة أولًا");
return;
}

state.tasks.unshift({
id:Date.now(),
text,
done:false
});

input.value="";
save();
renderTasks();
renderStats();
showToast("تمت إضافة المهمة");
}

focusList.addEventListener("click",e=>{

const button=e.target.closest("[data-action]");
if(!button)return;

const id=Number(button.dataset.id);
const task=state.tasks.find(x=>x.id===id);
if(!task)return;

if(button.dataset.action==="toggle"){
task.done=!task.done;
}

if(button.dataset.action==="delete"){
state.tasks=state.tasks.filter(x=>x.id!==id);
}

save();
renderTasks();
renderStats();

});

document.getElementById("menu").addEventListener("click",()=>{
document.getElementById("sidebar").classList.toggle("open");
});

document.querySelectorAll(".nav button").forEach(button=>{
button.addEventListener("click",()=>{
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
button.classList.add("active");
document.getElementById("sidebar").classList.remove("open");

const section=button.dataset.section;

if(section==="tasks"){
document.getElementById("taskInput").focus();
}

if(section==="stats"){
document.querySelector(".side-card").scrollIntoView({behavior:"smooth"});
}

if(section==="focus"){
window.scrollTo({top:0,behavior:"smooth"});
}
});
});

document.addEventListener("keydown",e=>{

if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="enter"){
e.preventDefault();
running?pauseTimer():startTimer();
}

if(e.code==="Space"&&document.activeElement.tagName!=="INPUT"){
e.preventDefault();
running?pauseTimer():startTimer();
}

if(e.key==="Escape"){
pauseTimer();
}
});

renderStats();
renderTasks();
resetTimer();
</script>

</body>
</html>
